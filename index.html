<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momentum — Study & Productivity</title>
<style>
:root{--bg:#121418;--s1:#1a1d23;--s2:#232730;--bd:#2f3440;--tx:#e9ebf0;--mu:#a0a8b6;--c:#22d3ee;--v:#8b5cf6;--er:#f87171;--ok:#4ade80;--wn:#fbbf24;--g:linear-gradient(135deg,var(--c),var(--v))}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:232px 1fr;min-height:100vh}
h1{font-size:1.7rem;margin:0;letter-spacing:-.02em}h2{font-size:1rem;margin:0 0 .7rem}p{margin:.3rem 0}.mu{color:var(--mu)}
a{color:var(--c)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--s2);padding:8px}
#side{background:var(--s1);border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 14px}.brand b{font-size:1.25rem;letter-spacing:-.02em}.brand small{display:block;color:var(--mu);font-size:.72rem}
#side nav{display:flex;flex-direction:column;gap:2px}
.nv{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;min-height:44px}
.nv:hover{background:var(--s2);color:var(--tx)}.nv[aria-current=page]{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 0 var(--c);font-weight:600}
#top{display:none}main{padding:28px;max-width:1100px;width:100%;margin:0 auto;outline:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}.clock{font-size:2rem;font-variant-numeric:tabular-nums;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--s2);border-radius:10px;padding:10px 12px}.tile b{display:block;font-size:1.35rem}.tile span{color:var(--mu);font-size:.8rem}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}.btn:hover{border-color:var(--c)}
.pri{background:var(--g);border:0;color:#0b0d11;font-weight:600}.dng{color:var(--er)}.sm{padding:4px 10px;min-height:32px;font-size:.85rem}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%;min-height:40px}textarea{min-height:90px;resize:vertical}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:.85rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row.end{justify-content:flex-end}.row .btn,.row.n>*{flex:0 0 auto}
.bar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.item>div{flex:1;min-width:0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--mu);background:none;cursor:pointer;flex:0 0 auto;padding:0;color:#0b0d11;font-weight:700}.chk[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
.done .tt2{text-decoration:line-through;color:var(--mu)}.chip{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:99px;padding:1px 9px;margin:2px 4px 0 0;color:var(--mu)}
.hi{border-color:var(--er);color:var(--er)}.od{border-color:var(--wn);color:var(--wn)}.empty{color:var(--mu);text-align:center;padding:22px 8px;border:1px dashed var(--bd);border-radius:12px}
.ringw{position:relative;width:260px;height:260px;margin:10px auto}.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}.ringw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringw .tt{font-size:3.2rem;font-weight:300;font-variant-numeric:tabular-nums}
.cur{background:rgba(34,211,238,.1);border-left:3px solid var(--c);padding-left:8px}.mood{display:flex;gap:6px;flex-wrap:wrap}.mood button{flex:1;min-width:64px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer}.mood button[aria-pressed=true]{border-color:var(--c);background:rgba(139,92,246,.25)}
.split{display:grid;grid-template-columns:300px 1fr;gap:16px}.li{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:10px 6px;cursor:pointer}.li[aria-current=true]{background:var(--s2)}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px}.cols div{flex:1;text-align:center;font-size:.72rem;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:var(--g);border-radius:6px 6px 0 0;min-height:2px}
.hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}.hb .bar{margin:0}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:.9rem}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(480px,94vw)}dialog::backdrop{background:rgba(0,0,0,.65)}
.err{color:var(--er);min-height:1.2em}#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:50}.toast{background:var(--s2);border:1px solid var(--bd);border-left:4px solid var(--ok);padding:10px 14px;border-radius:10px}.toast.e{border-left-color:var(--er)}.toast.w{border-left-color:var(--wn)}
pre,code{background:var(--bg);border-radius:6px;padding:1px 5px}.md h1,.md h2,.md h3{margin:.6rem 0 .3rem}
@media(max-width:800px){body{display:block}#top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
#side{position:fixed;z-index:30;width:250px;transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}main{padding:16px}.split{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<a class="skip" href="#main">Skip to content</a>
<header id="top"><button class="btn" id="menu" aria-label="Open navigation" aria-expanded="false">☰</button><b>Momentum</b></header>
<aside id="side" aria-label="Sidebar"><div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="34" height="34" rx="9" fill="url(#lg)"/><path d="M8 24l7-8 4 4 7-9" fill="none" stroke="#0b0d11" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Momentum</b><small>Build focus. Keep moving.</small></div></div>
<nav aria-label="Main"></nav></aside>
<main id="main" tabindex="-1"></main>
<dialog id="dlg"></dialog><div id="toasts" aria-live="polite"></div><input type="file" id="imp" accept="application/json,.json" hidden>
<script>
'use strict';
/* ===== Utilities ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const nice=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})};
const dur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+p2(m%60)+'m'};
const mmss=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return p2(Math.floor(s/60))+':'+p2(s%60)};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=(type==='e'?'Error: ':type==='w'?'Warning: ':'')+msg;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}
/* ===== Storage ===== */
const KEY='momentum.v1';
const DEF=()=>({v:1,tasks:[],events:[],journal:{},notes:[],sessions:[],timer:null,prefs:{focus:25,short:5,long:15,every:4,goalMin:120,goalTasks:3,sound:true,notify:false}});
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
function valid(d){return isObj(d)&&Array.isArray(d.tasks)&&Array.isArray(d.events)&&Array.isArray(d.notes)&&Array.isArray(d.sessions)&&isObj(d.journal)&&isObj(d.prefs)&&d.tasks.every(t=>isObj(t)&&typeof t.id==='string'&&typeof t.title==='string')&&d.sessions.every(s=>isObj(s)&&typeof s.id==='string'&&typeof s.ms==='number'&&typeof s.date==='string')&&d.notes.every(n=>isObj(n)&&typeof n.id==='string')&&d.events.every(e=>isObj(e)&&typeof e.id==='string'&&typeof e.date==='string'&&typeof e.start==='string'&&typeof e.end==='string')}
function migrate(d){if(!valid(d))throw new Error('invalid');const o=Object.assign(DEF(),d,{prefs:Object.assign(DEF().prefs,d.prefs)});const t=o.timer;if(!t||typeof t.target!=='number'||typeof t.elapsed!=='number'||!['focus','short','long'].includes(t.mode))o.timer=null;return o}
let S,corrupt=false;
(function(){const raw=localStorage.getItem(KEY);if(!raw){S=DEF();return}try{S=migrate(JSON.parse(raw))}catch(e){corrupt=true;try{localStorage.setItem(KEY+'.corrupt',raw)}catch(_){}S=DEF()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save. Browser storage may be full or blocked.','e')}}
/* ===== Timer logic (timestamp based) ===== */
const MODE={focus:'Focus',short:'Short Break',long:'Long Break'};
function newTimer(mode,cycle,taskId){return{id:uid(),mode,target:S.prefs[mode]*60000,elapsed:0,startedAt:null,taskId:taskId||null,cycle:cycle||0}}
if(!S.timer)S.timer=newTimer('focus',0);
const elapsedNow=t=>Math.min(t.target,Math.max(0,t.elapsed+(t.startedAt?Date.now()-t.startedAt:0)));
const taskById=id=>S.tasks.find(t=>t.id===id);
function record(t,completed){const ms=completed?t.target:elapsedNow(t);if(S.sessions.some(s=>s.id===t.id)||(!completed&&ms<1000))return;const k=taskById(t.taskId);S.sessions.push({id:t.id,taskId:k?k.id:null,title:k?k.title:'General focus',cat:k?k.cat:'',date:dkey(),ms,completed,at:Date.now()})}
function timerStart(){const t=S.timer;if(!t.startedAt){t.startedAt=Date.now();save();ui()}}
function timerPause(){const t=S.timer;if(t.startedAt){t.elapsed=elapsedNow(t);t.startedAt=null;save();ui()}}
function timerReset(){const t=S.timer;if(t.mode==='focus')record(t,false);S.timer=newTimer(t.mode,t.cycle,t.taskId);save();render()}
function timerSkip(){const t=S.timer;let next;if(t.mode==='focus'){record(t,false);next='short'}else next='focus';S.timer=newTimer(next,t.cycle,t.taskId);save();render()}
function timerComplete(){const t=S.timer;let next='focus',cycle=t.cycle;if(t.mode==='focus'){record(t,true);cycle++;next=cycle%S.prefs.every===0?'long':'short'}
 S.timer=newTimer(next,cycle,t.taskId);save();alertDone(t.mode,next);render()}
function alertDone(was,next){const msg=was==='focus'?'Focus session complete. Time for a '+MODE[next].toLowerCase()+'.':'Break over. Ready to focus?';toast(msg);if(S.prefs.sound)beep();
 if(S.prefs.notify&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Momentum',{body:msg})}catch(e){}}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.8)}catch(e){}}
let lastKey=dkey();
function tick(){const t=S.timer;if(t.startedAt&&elapsedNow(t)>=t.target){timerComplete();return}
 if(dkey()!==lastKey){lastKey=dkey();if(page==='dash')render()}ui()}
function ui(){const t=S.timer,el=elapsedNow(t),left=t.target-el;
 $$('.tt').forEach(e=>e.textContent=mmss(left));$$('.tm').forEach(e=>e.textContent=MODE[t.mode]);
 const r=$('#ring');if(r)r.style.strokeDashoffset=(565.49*el/t.target).toFixed(2);
 const lab=t.startedAt?'Pause':el>0?'Resume':'Start';$$('[data-act=tgo]').forEach(b=>b.textContent=lab);
 const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString();const dl=$('#dateline');if(dl)dl.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 document.title=t.startedAt?mmss(left)+' · Momentum':'Momentum — Study & Productivity'}
/* ===== Derived stats ===== */
const focusMs=k=>S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.ms,0);
const doneCount=k=>S.sessions.filter(s=>s.date===k&&s.completed).length;
const doneTasksOn=k=>S.tasks.filter(t=>t.completedAt&&dkey(new Date(t.completedAt))===k).length;
const taskMs=id=>S.sessions.filter(s=>s.taskId===id).reduce((a,s)=>a+s.ms,0);
const last7=()=>Array.from({length:7},(_,i)=>addDays(dkey(),i-6));
const PR={high:0,medium:1,low:2};
function sortTasks(a,by){return [...a].sort((x,y)=>by==='priority'?PR[x.priority]-PR[y.priority]:by==='created'?y.createdAt-x.createdAt:(x.due||'9999').localeCompare(y.due||'9999')||PR[x.priority]-PR[y.priority])}
const overdue=t=>t.status!=='done'&&t.due&&t.due<dkey();
/* ===== Dialog helpers ===== */
function ask(title,fields,ok,o={}){const d=$('#dlg');let h=`<form id="dform"><h2>${esc(title)}</h2>${o.msg?`<p>${esc(o.msg)}</p>`:''}`;
 for(const f of fields){const id='f_'+f.n,v=esc(f.v??'');h+=`<label for="${id}">${esc(f.l)}</label>`;
  if(f.t==='textarea')h+=`<textarea id="${id}" name="${f.n}">${v}</textarea>`;
  else if(f.t==='select')h+=`<select id="${id}" name="${f.n}">${f.o.map(([a,b])=>`<option value="${esc(a)}"${a===f.v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
  else h+=`<input id="${id}" name="${f.n}" type="${f.t||'text'}" value="${v}"${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}>`}
 h+=`<p class="err" id="derr" role="alert"></p><div class="row end"><button type="button" class="btn" id="dx">Cancel</button><button class="btn ${o.danger?'dng':'pri'}">${esc(o.ok||'Save')}</button></div></form>`;
 d.innerHTML=h;d.showModal();$('#dx').onclick=()=>d.close();
 $('#dform').onsubmit=e=>{e.preventDefault();const err=ok(Object.fromEntries(new FormData(e.target)));if(err)$('#derr').textContent=err;else d.close()}}
const confirmBox=(msg,fn,okLabel='Delete')=>ask('Please confirm',[],()=>{fn()},{msg,ok:okLabel,danger:1});
/* ===== Router ===== */
const NAV=[['dash','Dashboard'],['timer','Focus Timer'],['tasks','Tasks'],['planner','Planner'],['journal','Journal'],['notes','Notes'],['stats','Analytics'],['settings','Settings']];
let page=(location.hash.slice(1)||'dash');if(!NAV.some(n=>n[0]===page))page='dash';
$('#side nav').innerHTML=NAV.map(([k,l])=>`<button class="nv" data-p="${k}">${l}</button>`).join('');
function go(p){const leave=()=>{N.dirty=false;page=p;history.replaceState(null,'','#'+p);$('#side').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');render();$('#main').focus({preventScroll:true})};
 if(page==='notes'&&N.dirty&&p!=='notes')confirmBox('You have unsaved note changes. Discard them?',leave,'Discard');else leave()}
function render(){$$('.nv').forEach(b=>b.toggleAttribute('aria-current',b.dataset.p===page)||b.removeAttribute('aria-current'));$$('.nv').forEach(b=>{if(b.dataset.p===page)b.setAttribute('aria-current','page')});PAGES[page]();ui()}
const QUOTES=['Small steps, taken daily, beat big bursts.','Start the timer. The rest follows.','Finish one thing before opening another.','Progress counts even when it feels slow.','Protect your focus like you protect your sleep.','Done is the foundation for better.'];
const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`;
const bar=p=>`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><i style="width:${p}%"></i></div>`;
/* ===== Dashboard ===== */
function dashPage(){const k=dkey(),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 const pend=S.tasks.filter(t=>t.status!=='done'),dn=doneTasksOn(k),fm=focusMs(k),pct=Math.min(100,Math.round(fm/(S.prefs.goalMin*60000)*100)),tp=Math.min(100,Math.round(dn/S.prefs.goalTasks*100));
 const up=sortTasks(pend,'due').slice(0,5),ev=S.events.filter(e=>e.date===k).sort((a,b)=>a.start.localeCompare(b.start));
 $('#main').innerHTML=`<div class="hd"><div><h1>${g}</h1><p class="mu" id="dateline"></p><p class="mu">Build focus. Keep moving.</p></div><div class="clock" id="clock" aria-label="Current time"></div></div>
 <div class="grid"><section class="card"><h2>Today</h2><div class="stats">${tile(dn,'Tasks completed')}${tile(pend.length,'Tasks pending')}${tile(dur(fm),'Focus time')}${tile(doneCount(k),'Pomodoros')}</div>
 <p class="mu" style="margin-top:12px">Focus goal: ${dur(fm)} of ${S.prefs.goalMin} min (${pct}%)</p>${bar(pct)}<p class="mu">Task goal: ${dn} of ${S.prefs.goalTasks} (${tp}%)</p>${bar(tp)}</section>
 <section class="card" style="text-align:center"><h2>Quick focus</h2><p class="tm mu"></p><div class="tt" style="font-size:3rem;font-weight:300"></div><div class="row end n" style="justify-content:center;margin-top:8px"><button class="btn pri" data-act="tgo">Start</button><button class="btn" data-p="timer" data-act="nav">Open timer</button></div><p class="mu" style="margin-top:14px">${QUOTES[new Date().getDate()%QUOTES.length]}</p></section>
 <section class="card"><h2>Upcoming tasks</h2>${up.length?up.map(t=>`<div class="item"><div>${esc(t.title)}<br>${t.due?`<span class="chip ${overdue(t)?'od':''}">${overdue(t)?'Overdue · ':'Due '}${esc(t.due)}</span>`:''}<span class="chip">${esc(t.priority)}</span></div></div>`).join(''):'<div class="empty">No pending tasks. Add one in Tasks.</div>'}</section>
 <section class="card"><h2>Today's time blocks</h2>${ev.length?ev.map(e=>`<div class="item"><div>${e.start}–${e.end} · ${esc(e.title)}</div></div>`).join(''):'<div class="empty">Nothing scheduled today. Plan your day in Planner.</div>'}</section></div>`}
/* ===== Timer page ===== */
function timerPage(){const t=S.timer,opts=S.tasks.filter(x=>x.status!=='done');
 $('#main').innerHTML=`<div class="hd"><h1>Focus Timer</h1><span class="mu">Session ${t.cycle%S.prefs.every+(t.mode==='focus'?1:0)||S.prefs.every} of ${S.prefs.every} · ${doneCount(dkey())} completed today</span></div>
 <div class="card" style="max-width:520px;margin:auto;text-align:center"><div class="ringw"><svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="rg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><circle cx="100" cy="100" r="90" fill="none" stroke="#232730" stroke-width="10"/><circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.49" stroke-dashoffset="0"/></svg><div class="c"><div class="tt" role="timer"></div><div class="tm mu"></div></div></div>
 <div class="row n" style="justify-content:center"><button class="btn pri" data-act="tgo">Start</button><button class="btn" data-act="treset">Reset</button><button class="btn" data-act="tskip">Skip</button></div>
 <label for="ttask">Task for this session</label><select id="ttask" data-f="ttask"><option value="">General focus</option>${opts.map(o=>`<option value="${o.id}"${o.id===t.taskId?' selected':''}>${esc(o.title)}</option>`).join('')}</select>
 <p class="mu" style="margin-top:12px">Reset or skip during focus counts as abandoned. Paused and break time never count as focus.</p></div>`}
/* ===== Tasks ===== */
const F={q:'',st:'all',pr:'all',cat:'all',sort:'due'};
function tasksPage(){const cats=[...new Set(S.tasks.map(t=>t.cat).filter(Boolean))];
 $('#main').innerHTML=`<div class="hd"><h1>Tasks</h1><button class="btn pri" data-act="tnew">New task</button></div><div class="row" style="margin-bottom:12px">
 <input type="search" aria-label="Search tasks" placeholder="Search tasks" data-f="tq" value="${esc(F.q)}">
